# QA Full-Lifecycle CI
# Gates every runnable suite: SQL validation, API, UI automation, a11y, perf smoke.
# Each job uploads its report as a CI artifact, with `if: always()` so a red run
# still leaves the evidence behind, which is when you most need it.
#
# The nightly schedule is not decoration. Every suite here except the SQL one
# reads a live third-party demo site, so a badge that is only refreshed on push
# says "this passed whenever I last committed", not "this passes". The scheduled
# run makes the badge mean the second thing, and it surfaces a demo site
# changing under the suite on the day it happens rather than months later.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
        working-directory: sql-validation
      - name: Test the validation rules
        run: python -m pytest test_rules.py -v
        working-directory: sql-validation
      - name: Run SQL validation (stdlib only)
        run: python validate.py
        working-directory: sql-validation
      - name: Upload SQL validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-report
          path: sql-validation/reports

  api-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-testing/requirements.txt
      - run: pip install -r api-testing/requirements.txt
      - name: Run API tests
        run: pytest -v --junitxml=reports/junit.xml
        working-directory: api-testing
      - name: Upload API report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: api-testing/reports

  ui-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-automation/package-lock.json
      - run: npm ci
        working-directory: ui-automation
      - name: Typecheck
        run: npm run typecheck
        working-directory: ui-automation
      - name: Lint (catches a missing await on a click or an expect)
        run: npm run lint
        working-directory: ui-automation
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ui-automation
      - name: Run UI tests (all browsers)
        run: npm run test:e2e
        working-directory: ui-automation
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui-automation/playwright-report

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: accessibility/package-lock.json
      - run: npm ci
        working-directory: accessibility
      - name: Typecheck
        run: npm run typecheck
        working-directory: accessibility
      - run: npx playwright install --with-deps chromium
        working-directory: accessibility
      - name: Run accessibility scans
        run: npm run test:a11y
        working-directory: accessibility
      - name: Upload a11y reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-reports
          path: accessibility/reports

  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-*/k6 /usr/local/bin/
      - name: Run k6 smoke test
        run: |
          set -o pipefail
          mkdir -p reports
          k6 run smoke.js | tee reports/smoke.txt
        working-directory: performance
      - name: Upload perf report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke-report
          path: performance/reports
