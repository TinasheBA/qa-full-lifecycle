# QA Full-Lifecycle CI
# Gates every runnable suite: SQL validation, API, UI automation, a11y, perf smoke.
# Each uploads its report as a CI artifact.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sql-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SQL validation (stdlib only)
        run: python validate.py
        working-directory: sql-validation
      - name: Upload SQL report
        uses: actions/upload-artifact@v4
        with:
          name: sql-report
          path: sql-validation/demo.db

  api-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-testing/requirements.txt
      - name: Run API tests
        run: pytest -v
        working-directory: api-testing

  ui-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: ui-automation
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ui-automation
      - name: Run UI tests (all browsers)
        run: npm run test:e2e
        working-directory: ui-automation
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui-automation/playwright-report

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: accessibility
      - run: npx playwright install --with-deps chromium
        working-directory: accessibility
      - name: Run accessibility scans
        run: npm run test:a11y
        working-directory: accessibility
      - name: Upload a11y reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-reports
          path: accessibility/reports

  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-*/k6 /usr/local/bin/
      - name: Run k6 smoke test
        run: k6 run smoke.js
        working-directory: performance
